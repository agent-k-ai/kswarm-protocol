[package]
name = "anchor_integration"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["tier1"]
tier1 = []
tier2-bonsol = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["associated_token", "token_2022"] }
bincode = "1.3"
kswarm_protocol = { path = "../../solana/programs/kswarm_protocol" }
serde_json = "1"
solana-client = "2.3.6"
solana-program-test = "2.3.6"
solana-sdk = "2.3.1"
spl-associated-token-account = "6.0.0"
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
spl-token-2022 = "6.0.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
serial_test = "3"
